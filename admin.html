<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - GBAO SHOP</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html">GBAO ADMIN</a>
    <a href="index.html">Shop</a>
  </div>
</header>

<main class="container">

  <h1>👑 Quản lý GBAO SHOP</h1>

  <div id="adminError"></div>

  <div id="adminPanel">

    <section class="panel">

      <h2>➕ Thêm sản phẩm</h2>

      <input id="pName" placeholder="Tên sản phẩm">

      <input
        id="pPrice"
        type="number"
        placeholder="Giá">

      <button
        class="btn"
        onclick="addProduct()">
        Thêm sản phẩm
      </button>

    </section>


    <section class="panel">

      <h2>🔑 Nhập key vào kho</h2>

      <select id="inventoryProduct"></select>

      <select id="inventoryDuration">

        <option value="1">1 ngày</option>

        <option value="7">7 ngày</option>

        <option value="30">30 ngày</option>

      </select>

      <input
        id="keyValue"
        placeholder="Nhập key">

      <button
        class="btn green"
        onclick="addKey()">

        Thêm key vào kho

      </button>

    </section>


    <section class="panel">

      <h2>💰 Cộng số dư</h2>

      <select id="balanceUser"></select>

      <input
        id="balanceAmount"
        type="number"
        placeholder="Số tiền">

      <button
        class="btn orange"
        onclick="addBalance()">

        Cộng tiền

      </button>

    </section>


    <section class="panel">

      <h2>📊 Thống kê</h2>

      <div class="stats">

        <div>
          Người dùng
          <b id="userCount">0</b>
        </div>

        <div>
          Sản phẩm
          <b id="productCount">0</b>
        </div>

        <div>
          Key còn hàng
          <b id="stockCount">0</b>
        </div>

        <div>
          Đơn hàng
          <b id="orderCount">0</b>
        </div>

      </div>

    </section>


    <section class="panel">

      <h2>📦 Kho key</h2>

      <div id="inventoryTable"></div>

    </section>


    <section class="panel">

      <h2>👥 Người dùng</h2>

      <div id="usersTable"></div>

    </section>

  </div>

</main>

<script src="app.js"></script>

<script>

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(!GBAO.requireAdmin()) return;

    GBAO.renderAdmin();

  }
);


function addProduct(){

  const name =
    document
    .getElementById("pName")
    .value.trim();

  const price =
    Number(
      document
      .getElementById("pPrice")
      .value
    );

  if(!name || price <= 0){

    alert("Nhập tên và giá hợp lệ.");
    return;

  }

  GBAO.addProduct(
    name,
    price
  );

  alert("Đã thêm sản phẩm.");

  location.reload();

}


function addKey(){

  const productId =
    document
    .getElementById(
      "inventoryProduct"
    )
    .value;

  const duration =
    Number(
      document
      .getElementById(
        "inventoryDuration"
      )
      .value
    );

  const key =
    document
    .getElementById(
      "keyValue"
    )
    .value.trim();

  if(!productId || !key){

    alert("Vui lòng nhập key.");
    return;

  }

  GBAO.addKey(
    productId,
    duration,
    key
  );

  alert("Đã thêm key vào kho.");

  location.reload();

}


function addBalance(){

  const userId =
    document
    .getElementById(
      "balanceUser"
    )
    .value;

  const amount =
    Number(
      document
      .getElementById(
        "balanceAmount"
      )
      .value
    );

  if(amount <= 0){

    alert("Số tiền không hợp lệ.");
    return;

  }

  GBAO.addBalance(
    userId,
    amount
  );

  alert("Đã cộng tiền.");

  location.reload();

}

</script>

</body>
</html>
